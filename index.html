<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Zenta Group 2027 | Propuesta de Gestión y Alineación (OKR + EOS)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --accent: #818cf8;
      --success: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background: radial-gradient(circle at 15% 15%, #1e1b4b 0%, var(--bg-dark) 55%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      background: rgba(11, 17, 32, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 0.85rem; }
    .brand-icon {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.05rem;
      color: #0b1120;
    }
    .brand-title { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    .nav-controls { display: flex; align-items: center; gap: 0.5rem; }
    .tab-pills {
      display: flex;
      gap: 0.35rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.25rem;
      border-radius: 0.5rem;
      border: 1px solid var(--card-border);
      margin-right: 0.5rem;
    }
    .tab-pill {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 0.35rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-pill:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.1); }
    .tab-pill.active { background: var(--primary) !important; color: #0b1120 !important; font-weight: 700; }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      user-select: none;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.18); border-color: var(--primary); }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: linear-gradient(135deg, var(--primary), #2563eb) !important; border: none; color: #fff !important; }
    main {
      flex: 1;
      padding: 2.2rem 2.5rem;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .slide {
      display: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.65rem;
      border-radius: 0.25rem;
      margin-bottom: 0.75rem;
    }
    .badge-primary { background: rgba(56, 189, 248, 0.15); color: var(--primary); }
    .badge-accent { background: rgba(129, 140, 248, 0.15); color: var(--accent); }
    .badge-warning { background: rgba(251, 191, 36, 0.15); color: var(--warning); }
    .badge-danger { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
    .badge-success { background: rgba(52, 211, 153, 0.15); color: var(--success); }
    .slide-title { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.5rem; line-height: 1.2; }
    .slide-subtitle { font-size: 1.02rem; color: var(--text-muted); margin-bottom: 1.75rem; line-height: 1.5; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.85rem;
      padding: 1.35rem;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .card:hover { border-color: rgba(255, 255, 255, 0.25); }
    .card h3 { font-size: 1.12rem; font-weight: 700; margin-bottom: 0.65rem; }
    .card p { font-size: 0.88rem; color: var(--text-muted); line-height: 1.5; }
    .metric-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 0.5rem;
      padding: 0.75rem;
      margin-top: 0.85rem;
    }
    .metric-box strong { display: block; font-size: 1.1rem; color: var(--primary); margin-bottom: 0.15rem; }
    .metric-box span { font-size: 0.78rem; color: var(--text-muted); }
    .table-container { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 0.85rem; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }

      padding: 0.85rem 1.25rem;
